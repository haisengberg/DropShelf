name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release version
        id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build Universal DropShelf.app & Release Archive
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          chmod +x build.sh
          ./build.sh --arch universal --release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DropShelf-${{ steps.meta.outputs.version }}-universal
          path: |
            dist/DropShelf-*.zip
            dist/DropShelf-*.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/DropShelf-${{ steps.meta.outputs.version }}-universal.zip
            dist/DropShelf-${{ steps.meta.outputs.version }}-universal.zip.sha256
